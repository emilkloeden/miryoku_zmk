name: 'Build Corne with nice_nano (v1), display and LGB'
on: workflow_dispatch
jobs:
  build:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano"]'
      shield: '["corne_left","corne_right"]'
      kconfig: '["CONFIG_ZMK_DISPLAY=y","CONFIG_ZMK_RGB_UNDERGLOW=y","CONFIG_WS2812_STRIP=y","CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y"]'
